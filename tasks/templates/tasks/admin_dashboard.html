
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-6xl mx-auto p-4 sm:p-6 md:p-8">
    <div class="flex flex-col gap-4 sm:flex-row sm:justify-between sm:items-center mb-6 sm:mb-8">
        <div>
            <h1 class="text-2xl sm:text-3xl font-bold">Admin Dashboard</h1>
            <p class="text-gray-500 mt-1">Welcome, {{ request.user.username }}</p>
        </div>
        <a href="{% url 'logout' %}" class="bg-red-500 text-white px-4 py-2 rounded-lg text-center hover:bg-red-600 w-full sm:w-auto">
            Logout
        </a>
    </div>
    <div class="bg-white rounded-xl shadow p-4 sm:p-6">
        <h2 class="text-lg sm:text-xl font-semibold mb-3 sm:mb-4">
            Task Management
        </h2>
        <p class="text-gray-600">
            Admin task management will appear here.
        </p>
    </div>
</div>
</body>
</html>
