
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
<div class="bg-white p-6 sm:p-8 rounded-xl shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-6 text-center">Task Manager</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block mb-1 font-medium">Username</label>
            <input type="text" name="username" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black" required>
        </div>
        <div class="mb-5">
            <label class="block mb-1 font-medium">Password</label>
            <input type="password" name="password" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black" required>
        </div>
        <button type="submit" class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800">
            Login as Programmer
        </button>
    </form>

    <div class="flex items-center gap-3 my-5">
        <div class="flex-1 border-t"></div>
        <span class="text-sm text-gray-400">or</span>
        <div class="flex-1 border-t"></div>
    </div>

    <a href="/admin/" class="block w-full border border-gray-300 text-gray-700 text-center py-2 rounded-lg hover:bg-gray-100">
        Login via Admin
    </a>
</div>
</body>
</html>
